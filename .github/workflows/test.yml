name: Model training tests

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths-ignore:
      - README.md

permissions:
  contents: write
env:
  PYTHON_VERSION: "3.10"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            make requirements

      - name: Write service account JSON
        run: |
          mkdir -p .dvc/tmp
          echo "${{ secrets.GDRIVE_SERVICEACCOUNT_SECRET }}" | base64 -d > .dvc/tmp/remlaproject-sa.json

      - name: Pull DVC data
        run: dvc pull

      - name: Lint with pylint
        run: pylint training

      - name: Run tests with coverage
        run: |
          pytest --cov=training --cov-report=term-missing --cov-report=xml
          coverage xml
          coverage-badge -o coverage.svg

      - name: Coverage summary and update README
        run: |
          # Get coverage summary text
          coverage report --rcfile=.coveragerc -m > coverage_summary.txt

          # Define markers
          START_MARKER="<!-- COVERAGE_SUMMARY_START -->"
          END_MARKER="<!-- COVERAGE_SUMMARY_END -->"

          # Remove old summary block
          sed -i "/$START_MARKER/,/$END_MARKER/d" README.md

          # Prepare table header
          {
            echo ""
            echo "$START_MARKER"
            echo ""
            echo "| File | Statements | Miss | Coverage | Missing Lines |"
            echo "|------|------------|------|----------|----------------|"

            # Skip first 2 lines (header and separator), and last line (summary)
            tail -n +3 coverage_summary.txt | sed '$d' | while read -r line; do
              FILE=$(echo "$line" | awk '{print $1}')
              STMT=$(echo "$line" | awk '{print $2}')
              MISS=$(echo "$line" | awk '{print $3}')
              COV=$(echo "$line" | awk '{print $4}')
              MISS_LNS=$(echo "$line" | cut -d' ' -f5-)
              echo "| $FILE | $STMT | $MISS | $COV | $MISS_LNS |"
            done

            echo "$END_MARKER"
          } >> README.md
      - uses: Silleellie/pylint-github-action@v2.1
        with:
          lint-path: training
          python-version: 3.11  
        
      - name: Configure Git identity
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Commit and push updated README
        run: |
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}
          git add README.md
          git diff --cached --quiet || git commit -m "ci: update README with test results"
          git push origin ${{ github.ref_name }}
